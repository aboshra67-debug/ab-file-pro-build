name: P15 Safe Maintenance and APK
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "tools/**", "*.kts", "gradle.properties", "VERSION", ".github/workflows/p15-standalone.yml"]
permissions:
  contents: read
  actions: read
jobs:
  maintenance-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Verify complete Safe Source inputs
        shell: bash
        run: |
          set -euo pipefail
          ln -s project/tools tools
          ln -s project/tools/p15_ci p15-ci
          cd project
          sha256sum -c tools/p15_ci/p15-inputs.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build target APK and test APK
        working-directory: project
        run: gradle --no-daemon --stacktrace -PAB_FILE_PRO_NATIVE_TEST=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install Scanner host test dependencies
        run: python3 -m pip install --break-system-packages uiautomator2 Pillow pypdf
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android P15 and retained P12/P13/P14 regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none -no-snapshot
          script: |
            python3 p15-ci/run_checks.py
            python3 p15-ci/finalize.py
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P15_SAFE_MAINTENANCE_EVIDENCE
          path: |
            p15-evidence/
            runtime-evidence/
            project/app/build/outputs/androidTest-results/
            project/app/build/reports/androidTests/
            project/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified P15 APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: AB98_P15_SAFE_MAINTENANCE_APK
          path: p15-release/*
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
