name: AB File Pro Alpha98 P4 Status Bar Safe Build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-alpha98-p4-statusbar.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch exact Alpha98 P4 Safe Source, verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='LprGjHlY2ty6'
          curl --fail --silent --show-error -L --retry 3 "$API/shares/$SHARE/files?maxResults=1000" -o listing.json
          FILE_ID=$(python3 - <<'PY'
          import json
          hits=[x for x in json.load(open('listing.json')).get('files',[]) if x.get('fileName') == 'AB98_P4_Source.zip']
          if len(hits)!=1: raise SystemExit('Exact Alpha98 P4 source not found')
          print(hits[0]['fileId'])
          PY
          )
          curl --fail --silent --show-error -L --retry 3 -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          URL=$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')
          curl --fail --silent --show-error -L --retry 3 "$URL" -o source.zip
          echo '89799181f4651784529397a425b95ca81bbe142cf2ef38de90e4c4498e8aa323  source.zip' | sha256sum -c -
          mkdir project
          unzip -q source.zip -d project
          grep -qx '2.0.0-alpha98-prayer-ui-reference-polish' project/VERSION
          grep -q 'versionCode = 159' project/app/build.gradle.kts
          test -s project/app/src/main/assets/tessdata/ara.traineddata
          test -s project/app/src/main/assets/tessdata/eng.traineddata
          test -s project/app/src/main/assets/tessdata/fra.traineddata
      - name: Alpha98 P4 safe patch regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 project/tools/test_alpha98_p4_statusbar_nav.py
          python3 project/tools/test_alpha98_assistant_buttons_p3.py
          python3 project/tools/test_alpha98_navigation_safe_patch.py
          python3 project/tools/test_alpha98_calculator_currency_safe_patch.py
          python3 project/tools/test_alpha98_prayer_ui_contract.py
          python3 -m py_compile project/family-sync-server/main.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT='/usr/local/lib/android/sdk'
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make a separate test install without affecting original app
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^        debug {$/a\            applicationIdSuffix = ".alpha98p4"' project/app/build.gradle.kts
          sed -i 's/android:label="AB File Pro"/android:label="AB File Pro Alpha98 P4 Test"/' project/app/src/main/AndroidManifest.xml
          grep -q 'applicationIdSuffix = ".alpha98p4"' project/app/build.gradle.kts
      - name: Assemble P4 APK
        shell: bash
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK identity and signing; package
        shell: bash
        run: |
          set -euo pipefail
          APK='project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | head -n 1 | tee badging.txt
          grep -q "name='com.abfilepro.app.alpha98p4'" badging.txt
          grep -q "versionCode='159'" badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          mkdir release
          cp "$APK" release/AB98_P4.apk
          cp signature.txt release/
          cp project/PATCH_REPORT_ALPHA98_P4_STATUSBAR.txt release/
          echo 'Standalone test APK. Android phone installation not verified. Original AB File Pro stays unchanged.' > release/INSTALL_NOTICE.txt
          sha256sum release/AB98_P4.apk | tee release/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AB98_P4_APK
          path: release/*
          if-no-files-found: error
          retention-days: 7
