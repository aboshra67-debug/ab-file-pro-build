name: Build AB File Pro Alpha95
on:
  push:
    paths:
      - ".github/workflows/build-alpha82.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve and download Alpha82 Safe Source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='i1QI9_vBu-rI'
          curl -L --fail --retry 3 "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          FILE_ID="$(python3 -c 'import json; d=json.load(open("list.json")); print(d["files"][0]["fileId"])')"
          curl -L --fail --retry 3 -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL="$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')"
          curl -L --fail --retry 3 "$DOWNLOAD_URL" -o alpha95-source.zip
          echo "b632d4389689b7983333192dff9c70d8f34c8fde89d31a4f02928cca93a5dc84  alpha82-source.zip" | sha256sum -c -
          mkdir -p android
          unzip -q alpha82-source.zip -d android
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Alpha95 contract tests
        working-directory: android
        run: python3 tools/test_alpha95_price_comparison_live_contract.py

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" AB_FILE_PRO_V2_ALPHA82_FAMILY_CLOUD_SYNC_ARM64_TEST_DEBUG_SIGNED.apk
          sha256sum AB_FILE_PRO_V2_ALPHA82_FAMILY_CLOUD_SYNC_ARM64_TEST_DEBUG_SIGNED.apk | tee AB_FILE_PRO_V2_ALPHA82_FAMILY_CLOUD_SYNC_ARM64_TEST_DEBUG_SIGNED.apk.sha256.txt

      - name: Upload Alpha82 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AB_FILE_PRO_V2_ALPHA82_FAMILY_CLOUD_SYNC_BUILD
          path: |
            AB_FILE_PRO_V2_ALPHA82_FAMILY_CLOUD_SYNC_ARM64_TEST_DEBUG_SIGNED.apk
            AB_FILE_PRO_V2_ALPHA82_FAMILY_CLOUD_SYNC_ARM64_TEST_DEBUG_SIGNED.apk.sha256.txt
          if-no-files-found: error
          retention-days: 7
