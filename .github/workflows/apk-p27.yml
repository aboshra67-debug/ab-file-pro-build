name: Publish P27 test APKs as a release
on:
  push:
    branches: ["apk/p27-test-20261028"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P27_OUTPUTS
          run-id: 40139113487
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dl
          ls -la
          sha256sum -c SHA256SUMS.txt
          gh release create p27-test-apk-vc179 *PLAY_TEST.apk *PLAY_QA_R8.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target apk/p27-test-20261028 --prerelease \
            --title "AB File Pro P27 (VC179) - assistant complete + Pro (debug-signed test)" \
            --notes "Debug-signed test builds from verified run 40139113487 (attempt 2 green). PLAY_TEST = com.abfilepro.app.p27mainttrial. PLAY_QA_R8 = com.abfilepro.app.p27qa. Test ads only; Pro products need Play Console."
