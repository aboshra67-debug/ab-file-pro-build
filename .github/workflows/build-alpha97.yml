name: Build AB File Pro Alpha97 Final

on:
  push:
    paths:
      - ".github/workflows/build-alpha97.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download exact Alpha97 Safe Source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='oPiMrbtFffNC'
          WANT='AB_FILE_PRO_V2_ALPHA97_PERSONAL_ASSISTANT_FINAL_HARDENING_SAFE_SOURCE.zip'
          curl -L --fail --silent --show-error "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open("list.json"))
          wanted="AB_FILE_PRO_V2_ALPHA97_PERSONAL_ASSISTANT_FINAL_HARDENING_SAFE_SOURCE.zip"
          for x in d.get("files",[]):
              if x.get("fileName")==wanted:
                  print(x["fileId"])
                  break
          PY
          )
          test -n "$FILE_ID"
          curl -L --fail --silent --show-error -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')
          curl -L --fail --silent --show-error "$DOWNLOAD_URL" -o alpha97-source.zip
          echo "a5796729e6e95a6ca28f4a1174693855ef84b7f15ee5413f696a07b04352a2c7  alpha97-source.zip" | sha256sum -c -
          mkdir project
          unzip -q alpha97-source.zip -d project
          grep -q '2.0.0-alpha97-personal-assistant-final-hardening' project/VERSION
          grep -q 'versionCode = 158' project/app/build.gradle.kts

      - name: Run Alpha97 final assistant audit
        shell: bash
        run: |
          set -euo pipefail
          python3 project/tools/test_alpha97_personal_assistant_final_contract.py
          python3 -m py_compile project/family-sync-server/main.py
          ! find project -type f -name '*.tmp' -print -quit | grep -q .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore OCR traineddata assets
        shell: bash
        run: |
          set -euo pipefail
          D="project/app/src/main/assets/tessdata"
          mkdir -p "$D"
          curl -fL --retry 3 -o "$D/eng.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -fL --retry 3 -o "$D/ara.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          curl -fL --retry 3 -o "$D/fra.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata

      - name: Compile Alpha97
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run Android lint
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Verify and package Alpha97
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app'"
          echo "$BADGING" | grep -q "versionCode='158'"
          echo "$BADGING" | grep -q "versionName='2.0.0-alpha97-personal-assistant-final-hardening'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          mkdir -p release
          cp "$APK" release/AB_FILE_PRO_V2_ALPHA97_PERSONAL_ASSISTANT_FINAL_HARDENING_ARM64_TEST_DEBUG_SIGNED.apk
          cp alpha97-source.zip release/AB_FILE_PRO_V2_ALPHA97_PERSONAL_ASSISTANT_FINAL_HARDENING_SAFE_SOURCE.zip
          cp project/PATCH_REPORT_V2_ALPHA97_PERSONAL_ASSISTANT_FINAL_HARDENING.txt release/
          cp project/docs/PERSONAL_ASSISTANT_ALPHA97_FINAL_AUDIT.md release/
          if [ -f project/app/build/reports/lint-results-debug.html ]; then cp project/app/build/reports/lint-results-debug.html release/ALPHA97_LINT_REPORT.html; fi
          sha256sum release/* > release/AB_FILE_PRO_V2_ALPHA97_PERSONAL_ASSISTANT_FINAL_HARDENING_SHA256SUMS.txt

      - name: Upload Alpha97 package
        uses: actions/upload-artifact@v4
        with:
          name: AB_FILE_PRO_V2_ALPHA97_PERSONAL_ASSISTANT_FINAL_HARDENING
          path: release/*
          if-no-files-found: error
          retention-days: 7
