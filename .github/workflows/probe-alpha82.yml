name: Probe Alpha82 Source
on:
  push:
    paths:
      - ".github/workflows/probe-alpha82.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve direct Alpha82 source URL
        shell: bash
        run: |
          set -euxo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='_x66KdzeNB9x'
          curl -L --fail "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          cat list.json
          FILE_ID="$(python3 -c 'import json; d=json.load(open("list.json")); print(d["files"][0]["fileId"])')"
          curl -L --fail -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          echo "=== DOWNLOAD RESPONSE ==="
          cat download.json
