name: Probe Alpha82 Source
on:
  push:
    paths:
      - ".github/workflows/probe-alpha82.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find firestorage file endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o bundle.js
          python3 - <<'PY'
          import re
          s=open('bundle.js',encoding='utf-8').read()
          pats=[
              r'.{0,180}(?:download|share|publicId|fileId|objects/|folders/).{0,220}',
              r'["\x60\x27][^"\x60\x27]{0,180}(?:download|objects|folders|shares?)[^"\x60\x27]{0,180}["\x60\x27]'
          ]
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,s,re.I):
                  x=m.group(0)
                  if x not in seen:
                      seen.add(x); print(x)
          PY
