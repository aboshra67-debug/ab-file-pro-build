name: Probe Alpha82 Source
on:
  push:
    paths:
      - ".github/workflows/probe-alpha82.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client bundle
        shell: bash
        run: |
          set -euxo pipefail
          for URL in \
            'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js' \
            'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' \
            'https://firestorage.ai/_next/static/chunks/5841-1160578ba9bb4f3e.js'; do
            echo "=== $URL ==="
            curl -L -sS -D - "$URL" -o bundle.js || true
            wc -c bundle.js || true
            cat bundle.js || true
            echo
          done
