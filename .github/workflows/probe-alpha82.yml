name: Probe Alpha82 Source
on:
  push:
    paths:
      - ".github/workflows/probe-alpha82.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect shared source page
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://firestorage.ai/ja/f/_x66KdzeNB9x' -o share.html
          echo "=== HTML ==="
          cat share.html
          echo
          echo "=== JS SOURCES ==="
          grep -oE '<script[^>]+src="[^"]+"' share.html || true
