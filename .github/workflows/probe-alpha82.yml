name: Probe Alpha82 Source
on:
  push:
    paths:
      - ".github/workflows/probe-alpha82.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client bundle
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://firestorage.ai'
          JS='/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          curl -L --fail "$BASE$JS" -o page.js
          echo "=== MATCHES ==="
          tr ';' '\n' < page.js | grep -Ei 'download|share|public|api/|file_id|public_id|token' | head -250 || true
