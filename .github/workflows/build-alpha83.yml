name: Build AB File Pro Alpha83
on:
  push:
    paths:
      - '.github/workflows/build-alpha83.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download exact Alpha83 Safe Source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='30LQ49AZglTM'
          curl -L --fail --silent --show-error "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('list.json'))
          wanted='AB_FILE_PRO_V2_ALPHA83_FAMILY_SECURE_PAIRING_SAFE_SOURCE.zip'
          for x in d.get('files',[]):
              if x.get('fileName')==wanted:
                  print(x['fileId']); break
          PY
          )
          test -n "$FILE_ID"
          curl -L --fail --silent --show-error -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')
          curl -L --fail --silent --show-error "$DOWNLOAD_URL" -o alpha83-source.zip
          echo 'b572a27574eb32790544c6b4008e5bb76d0b6d2283e008562b666b8b4a6d34cd  alpha83-source.zip' | sha256sum -c -
          mkdir project
          unzip -q alpha83-source.zip -d project
          grep -q '2.0.0-alpha83-family-secure-pairing' project/VERSION
          grep -q 'versionCode = 144' project/app/build.gradle.kts
          ! grep -q 'FAMILY_SYNC_APP_KEY' project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Alpha83 contract
        working-directory: project
        run: python3 tools/test_alpha83_family_secure_pairing_contract.py

      - name: Build Alpha83 debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -type f -name apksigner | sort -V | tail -n 1)
          BADGING=$($AAPT dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app'"
          echo "$BADGING" | grep -q "versionCode='144'"
          echo "$BADGING" | grep -q "versionName='2.0.0-alpha83-family-secure-pairing'"
          $APKSIGNER verify --verbose --print-certs "$APK"
          mkdir -p release
          cp "$APK" release/AB_FILE_PRO_V2_ALPHA83_FAMILY_SECURE_PAIRING_ARM64_TEST_DEBUG_SIGNED.apk
          cp alpha83-source.zip release/AB_FILE_PRO_V2_ALPHA83_FAMILY_SECURE_PAIRING_SAFE_SOURCE.zip
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload Alpha83 package
        uses: actions/upload-artifact@v4
        with:
          name: AB_FILE_PRO_V2_ALPHA83_FAMILY_SECURE_PAIRING
          path: release/*
          if-no-files-found: error
          retention-days: 7