name: Publish P30 test APKs as a release
on:
  push:
    branches: ["apk/p30-test-20261029"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P30_OUTPUTS
          run-id: 40771066292
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dl
          ls -la
          sha256sum -c SHA256SUMS.txt
          gh release create p30-test-apk-vc182 *PLAY_TEST.apk *PLAY_QA_R8.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target apk/p30-test-20261029 --prerelease \
            --title "AB File Pro P30 (VC182) - assistant polish (debug-signed test)" \
            --notes "Debug-signed test builds from verified run 40771066292 (green). PLAY_TEST = com.abfilepro.app.p30mainttrial. PLAY_QA_R8 = com.abfilepro.app.p30qa. Test ads only; Pro products need Play Console."
