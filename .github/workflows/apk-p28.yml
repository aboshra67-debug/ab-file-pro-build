name: Publish P28 test APKs as a release
on:
  push:
    branches: ["apk/p28-test-20261028"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P28_OUTPUTS
          run-id: 40679082290
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dl
          ls -la
          sha256sum -c SHA256SUMS.txt
          gh release create p28-test-apk-vc180 *PLAY_TEST.apk *PLAY_QA_R8.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target apk/p28-test-20261028 --prerelease \
            --title "AB File Pro P28 (VC180) - translations + dark-mode fixes (debug-signed test)" \
            --notes "Debug-signed test builds from verified run 40679082290 (green). PLAY_TEST = com.abfilepro.app.p28mainttrial. PLAY_QA_R8 = com.abfilepro.app.p28qa. Test ads only; Pro products need Play Console."
