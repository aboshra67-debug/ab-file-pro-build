name: Publish P34 test APKs as a release
on:
  push:
    branches: ["apk/p34-test-20261108"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P34_OUTPUTS
          run-id: 42415266443
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dl
          ls -la
          sha256sum -c SHA256SUMS.txt
          gh release create p34-test-apk-vc186 *PLAY_TEST.apk *PLAY_QA_R8.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target apk/p34-test-20261108 --prerelease \
            --title "AB File Pro P34 (VC186) - clearer points and Pro texts + subscription section in Settings (debug-signed test)" \
            --notes "Debug-signed test builds from verified run 42415266443 (green). PLAY_TEST = com.abfilepro.app.p34mainttrial. PLAY_QA_R8 = com.abfilepro.app.p34qa. Test ads only; Pro products need Play Console."
