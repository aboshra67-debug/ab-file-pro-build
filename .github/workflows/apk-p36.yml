name: Publish P36 test APKs as a release
on:
  push:
    branches: ["apk/p36-test-20261108"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P36_OUTPUTS
          run-id: 42450007957
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dl
          ls -la
          sha256sum -c SHA256SUMS.txt
          gh release create p36-test-apk-vc188 *PLAY_TEST.apk *PLAY_QA_R8.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target apk/p36-test-20261108 --prerelease \
            --title "AB File Pro P36 (VC188) - home banner removed, points chip on every screen, points section in Settings (debug-signed test)" \
            --notes "Debug-signed test builds from verified run 42450007957 (green). PLAY_TEST = com.abfilepro.app.p36mainttrial. PLAY_QA_R8 = com.abfilepro.app.p36qa. Test ads only; Pro products need Play Console."
