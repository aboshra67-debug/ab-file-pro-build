name: Publish P24 test APKs as a release
on:
  push:
    branches: ["apk/p24-test-20261022"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P24_OUTPUTS
          run-id: 39745454370
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dl
          ls -la
          sha256sum -c SHA256SUMS.txt
          gh release create p24-test-apk-vc176 *PLAY_TEST.apk *PLAY_QA_R8.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target apk/p24-test-20261022 --prerelease \
            --title "AB File Pro P24 (VC176) - test APKs (debug-signed)" \
            --notes "Debug-signed test builds from verified run 39745454370. PLAY_TEST = com.abfilepro.app.p24mainttrial (debug). PLAY_QA_R8 = com.abfilepro.app.p24qa (release code, R8). Both install side by side with older versions."
