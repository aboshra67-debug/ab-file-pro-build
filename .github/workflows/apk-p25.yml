name: Publish P25 test APKs as a release
on:
  push:
    branches: ["apk/p25-test-20261022"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P25_OUTPUTS
          run-id: 39826238457
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dl
          sha256sum -c SHA256SUMS.txt
          gh release create p25-test-apk-vc177 *PLAY_TEST.apk *PLAY_QA_R8.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target apk/p25-test-20261022 --prerelease \
            --title "AB File Pro P25 (VC177) - test APKs (debug-signed)" \
            --notes "Debug-signed test builds from verified run 39826238457. PLAY_TEST = com.abfilepro.app.p25mainttrial. PLAY_QA_R8 = com.abfilepro.app.p25qa. Both install side by side with older versions."
