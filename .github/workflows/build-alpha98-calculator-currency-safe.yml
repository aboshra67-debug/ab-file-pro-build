name: Build AB File Pro Alpha98 Calculator Currency Safe Patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-alpha98-calculator-currency-safe.yml"
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AB_FILE_PRO_JKS_BASE64: ${{ secrets.AB_FILE_PRO_JKS_BASE64 }}
      AB_FILE_PRO_STORE_PASSWORD: ${{ secrets.AB_FILE_PRO_STORE_PASSWORD }}
      AB_FILE_PRO_KEY_PASSWORD: ${{ secrets.AB_FILE_PRO_KEY_PASSWORD }}
      AB_FILE_PRO_KEY_ALIAS: ${{ secrets.AB_FILE_PRO_KEY_ALIAS }}
    steps:
      - name: Download exact Alpha98 safe-patch source and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='Y-RlAvh9POim'
          WANT='AB_FILE_PRO_V2_ALPHA98_CALCULATOR_CURRENCY_SAFE_PATCH_P1_SOURCE.zip'
          curl --fail --silent --show-error -L --retry 3 "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          FILE_ID=$(python3 - <<'PY'
          import json
          for item in json.load(open("list.json")).get("files",[]):
              if item.get("fileName") == "AB_FILE_PRO_V2_ALPHA98_CALCULATOR_CURRENCY_SAFE_PATCH_P1_SOURCE.zip":
                  print(item["fileId"]); break
          PY
          )
          test -n "$FILE_ID"
          curl --fail --silent --show-error -L --retry 3 -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          URL=$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')
          curl --fail --silent --show-error -L --retry 3 "$URL" -o alpha98-patch-source.zip
          echo 'c0dbcdd8538794bb82ae659b4b352f30e40b1bc73b11ba88477d159b9d05d318  alpha98-patch-source.zip' | sha256sum -c -
          mkdir project
          unzip -q alpha98-patch-source.zip -d project
          grep -q '^2.0.0-alpha98-prayer-ui-reference-polish$' project/VERSION
          grep -q 'versionCode = 159' project/app/build.gradle.kts
          test -s project/app/src/main/res/drawable-nodpi/prayer_mosque_banner.png
          test -s project/app/src/main/assets/tessdata/ara.traineddata
          test -s project/app/src/main/assets/tessdata/eng.traineddata
          test -s project/app/src/main/assets/tessdata/fra.traineddata
      - name: Verify functional patch and prayer UI contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 project/tools/test_alpha98_prayer_ui_contract.py
          python3 project/tools/test_alpha98_calculator_currency_safe_patch.py
          python3 -m py_compile project/family-sync-server/main.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Load original signing key when configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$AB_FILE_PRO_JKS_BASE64" ] && [ -n "$AB_FILE_PRO_STORE_PASSWORD" ] && [ -n "$AB_FILE_PRO_KEY_PASSWORD" ]; then
            printf '%s' "$AB_FILE_PRO_JKS_BASE64" | base64 -d > project/app/ab-file-pro-test.jks
            chmod 600 project/app/ab-file-pro-test.jks
            echo 'Signing key present; will confirm certificate matches original Alpha98'
          else
            echo 'No original keystore configured; preview-only fallback will protect installed data'
          fi
      - name: Build Android package
        working-directory: project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check signature compatibility and decide output type
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -s "$APK"
          BADGING=$("$AAPT" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app'"
          echo "$BADGING" | grep -q "versionCode='159'"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt | tr '[:upper:]' '[:lower:]')
          echo "Signer certificate SHA-256: $CERT"
          mkdir -p release
          if [ "$CERT" = '141147c9487e3e31ba80cbf57c59dd43024cf919ed2edef1cc6e057e23d944fa' ]; then
            cp "$APK" release/AB_FILE_PRO_V2_ALPHA98_CALCULATOR_CURRENCY_P1_UPDATE_COMPATIBLE_SIGNED.apk
            echo "signing_compatible=true" >> "$GITHUB_OUTPUT"
            echo "PASS: Certificate matches original Alpha98: existing installation update is signature-compatible; physical-device install not tested" | tee release/INSTALL_COMPATIBILITY.txt
          else
            echo "signing_compatible=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: Original signer unavailable; never install this same-package APK over existing app." | tee release/INSTALL_COMPATIBILITY.txt
            echo "A separate-install test APK will be built, preserving the original installation and data." | tee -a release/INSTALL_COMPATIBILITY.txt
          fi
      - name: Build independently installable Alpha98 P1 preview when signature mismatches
        if: steps.package.outputs.signing_compatible != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^        debug {$/a\            applicationIdSuffix = ".alpha98p1"' project/app/build.gradle.kts
          sed -i 's/android:label="AB File Pro"/android:label="AB File Pro Alpha98 P1 Test"/' project/app/src/main/AndroidManifest.xml
          (cd project && gradle --no-daemon --stacktrace :app:assembleDebug)
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -s "$APK"
          BADGING=$("$AAPT" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app.alpha98p1'"
          echo "$BADGING" | grep -q "versionCode='159'"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee release/preview_signature_verification.txt
          cp "$APK" release/AB_FILE_PRO_V2_ALPHA98_CALCULATOR_CURRENCY_P1_INDEPENDENT_PREVIEW_TEST_SIGNED.apk
      - name: Upload build artifact with checksums
        shell: bash
        run: |
          set -euo pipefail
          cp project/PATCH_REPORT_V2_ALPHA98_CALCULATOR_CURRENCY_SAFE_P1.txt release/
          sha256sum release/*.apk | tee release/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AB_FILE_PRO_ALPHA98_CALCULATOR_CURRENCY_P1
          path: release/*
          if-no-files-found: error
          retention-days: 7
