name: Build AB File Pro Alpha95

on:
  push:
    paths:
      - ".github/workflows/build-alpha84.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download exact Alpha94 Safe Source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='yBi77GO5fNdK'
          WANT='AB_FILE_PRO_V2_ALPHA94_SUMMARY_CARD_POLISH_SAFE_SOURCE.zip'
          curl -L --fail --silent --show-error "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open("list.json"))
          wanted="AB_FILE_PRO_V2_ALPHA94_SUMMARY_CARD_POLISH_SAFE_SOURCE.zip"
          for x in d.get("files",[]):
              if x.get("fileName")==wanted:
                  print(x["fileId"])
                  break
          PY
          )
          test -n "$FILE_ID"
          curl -L --fail --silent --show-error -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')
          curl -L --fail --silent --show-error "$DOWNLOAD_URL" -o alpha94-source.zip
          echo "ed1ce26227d397e0c8a84d7d4bc43e718f8de5f6a9ccf04738d8cfdb60b7b53f  alpha94-source.zip" | sha256sum -c -
          mkdir project
          unzip -q alpha94-source.zip -d project
          grep -q '2.0.0-alpha94-summary-card-polish' project/VERSION
          grep -q 'versionCode = 155' project/app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha94-summary-card-polish"' project/app/build.gradle.kts

      - name: Validate Alpha94 summary card polish
        shell: bash
        run: |
          set -euo pipefail
          python3 project/tools/test_alpha94_summary_card_polish_contract.py
          grep -q 'RENTAL_CONTRACT("rental_contract", "عقد إيجار")' project/app/src/main/java/com/abfilepro/app/assistant/DocumentRenewalCodec.kt
          grep -q 'VISA("visa", "تأشيرة / فيزا")' project/app/src/main/java/com/abfilepro/app/assistant/DocumentRenewalCodec.kt
          ! grep -q 'AssistantModule.DOCUMENTS' project/app/src/main/java/com/abfilepro/app/assistant/FamilyCloudSync.kt
          echo "Alpha94 summary card polish contract: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore OCR traineddata assets
        shell: bash
        run: |
          set -euo pipefail
          D="project/app/src/main/assets/tessdata"
          mkdir -p "$D"
          curl -fL --retry 3 -o "$D/eng.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -fL --retry 3 -o "$D/ara.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          curl -fL --retry 3 -o "$D/fra.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata

      - name: Build Alpha94 debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and package Alpha94
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app'"
          echo "$BADGING" | grep -q "versionCode='155'"
          echo "$BADGING" | grep -q "versionName='2.0.0-alpha94-summary-card-polish'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          mkdir -p release
          cp "$APK" release/AB_FILE_PRO_V2_ALPHA94_SUMMARY_CARD_POLISH_ARM64_TEST_DEBUG_SIGNED.apk
          cp alpha94-source.zip release/AB_FILE_PRO_V2_ALPHA94_SUMMARY_CARD_POLISH_SAFE_SOURCE.zip
          cp project/PATCH_REPORT_V2_ALPHA94_SUMMARY_CARD_POLISH.txt release/
          sha256sum release/* > release/AB_FILE_PRO_V2_ALPHA94_SUMMARY_CARD_POLISH_SHA256SUMS.txt

      - name: Upload Alpha94 package
        uses: actions/upload-artifact@v4
        with:
          name: AB_FILE_PRO_V2_ALPHA94_SUMMARY_CARD_POLISH
          path: release/*
          if-no-files-found: error
          retention-days: 7
