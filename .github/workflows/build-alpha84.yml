name: Build AB File Pro Alpha96

on:
  push:
    paths:
      - ".github/workflows/build-alpha84.yml"
      - "alpha96_patch_parts/**"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Alpha96 patch
        uses: actions/checkout@v4

      - name: Download exact Alpha95 Safe Source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='OB6ld8OunCaj'
          WANT='AB_FILE_PRO_V2_ALPHA95_PRICE_COMPARISON_LIVE_SAFE_SOURCE.zip'
          curl -L --fail --silent --show-error "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open("list.json"))
          wanted="AB_FILE_PRO_V2_ALPHA95_PRICE_COMPARISON_LIVE_SAFE_SOURCE.zip"
          for x in d.get("files",[]):
              if x.get("fileName")==wanted:
                  print(x["fileId"])
                  break
          PY
          )
          test -n "$FILE_ID"
          curl -L --fail --silent --show-error -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')
          curl -L --fail --silent --show-error "$DOWNLOAD_URL" -o alpha95-source.zip
          echo "96e3375165a54e1fa3cd539bff43be60ab84231121d73739803546a3f1d65aa6  alpha95-source.zip" | sha256sum -c -
          mkdir project
          unzip -q alpha95-source.zip -d project
          grep -q '2.0.0-alpha95-price-comparison-live' project/VERSION
          grep -q 'versionCode = 156' project/app/build.gradle.kts

      - name: Apply Alpha96 classic UI safe patch
        shell: bash
        run: |
          set -euo pipefail
          cat alpha96_patch_parts/*.b64 > alpha96.patch.b64
          base64 -d alpha96.patch.b64 > alpha96.patch
          echo "76a739f3af59714707e28d9751f23ba74503b27222c5a5807fcf8eba5f4e531f  alpha96.patch" | sha256sum -c -
          patch -d project -p1 < alpha96.patch
          grep -q '2.0.0-alpha96-price-comparison-classic-ui' project/VERSION
          grep -q 'versionCode = 157' project/app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha96-price-comparison-classic-ui"' project/app/build.gradle.kts
          python3 project/tools/test_alpha96_price_comparison_classic_ui_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore OCR traineddata assets
        shell: bash
        run: |
          set -euo pipefail
          D="project/app/src/main/assets/tessdata"
          mkdir -p "$D"
          curl -fL --retry 3 -o "$D/eng.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -fL --retry 3 -o "$D/ara.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          curl -fL --retry 3 -o "$D/fra.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata

      - name: Build Alpha96 debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and package Alpha96
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app'"
          echo "$BADGING" | grep -q "versionCode='157'"
          echo "$BADGING" | grep -q "versionName='2.0.0-alpha96-price-comparison-classic-ui'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          mkdir -p release
          cp "$APK" release/AB_FILE_PRO_V2_ALPHA96_PRICE_COMPARISON_CLASSIC_UI_ARM64_TEST_DEBUG_SIGNED.apk
          cp project/PATCH_REPORT_V2_ALPHA96_PRICE_COMPARISON_CLASSIC_UI.txt release/
          (cd project && zip -qr ../release/AB_FILE_PRO_V2_ALPHA96_PRICE_COMPARISON_CLASSIC_UI_SAFE_SOURCE.zip . -x '.gradle/*' 'build/*' 'app/build/*' '*.jks')
          sha256sum release/* > release/AB_FILE_PRO_V2_ALPHA96_PRICE_COMPARISON_CLASSIC_UI_SHA256SUMS.txt

      - name: Upload Alpha96 package
        uses: actions/upload-artifact@v4
        with:
          name: AB_FILE_PRO_V2_ALPHA96_PRICE_COMPARISON_CLASSIC_UI
          path: release/*
          if-no-files-found: error
          retention-days: 7
