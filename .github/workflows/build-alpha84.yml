name: Build AB File Pro Alpha85

on:
  push:
    paths:
      - ".github/workflows/build-alpha84.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download exact Alpha85 Safe Source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='8JZVEZ4hqsVK'
          curl -L --fail --silent --show-error "$API/shares/$SHARE/files?maxResults=1000" -o list.json
          FILE_ID=$(python3 - <<'PY'
          import json
          d=json.load(open("list.json"))
          wanted="AB_FILE_PRO_V2_ALPHA85_HEALTH_MEDICATION_SAFE_SOURCE.zip"
          for x in d.get("files",[]):
              if x.get("fileName")==wanted:
                  print(x["fileId"])
                  break
          PY
          )
          test -n "$FILE_ID"
          curl -L --fail --silent --show-error -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          DOWNLOAD_URL=$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')
          curl -L --fail --silent --show-error "$DOWNLOAD_URL" -o alpha85-source.zip
          echo "23c3c152997413030d43a6af5f0f89d07b6191c31cdecbdcaf83a17834e0c2fa  alpha85-source.zip" | sha256sum -c -
          mkdir project
          unzip -q alpha85-source.zip -d project
          grep -q '2.0.0-alpha85-health-medication' project/VERSION
          grep -q 'versionCode = 146' project/app/build.gradle.kts
          grep -q 'HealthMedicationScreen' project/app/src/main/java/com/abfilepro/app/ui/screens/assistant/HealthMedicationScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore OCR traineddata assets
        shell: bash
        run: |
          set -euo pipefail
          D="project/app/src/main/assets/tessdata"
          mkdir -p "$D"
          curl -fL --retry 3 -o "$D/eng.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -fL --retry 3 -o "$D/ara.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          curl -fL --retry 3 -o "$D/fra.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata

      - name: Run Alpha85 contracts
        working-directory: project
        run: python3 tools/test_alpha85_health_medication_contract.py

      - name: Build Alpha85 debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app'"
          echo "$BADGING" | grep -q "versionCode='146'"
          echo "$BADGING" | grep -q "versionName='2.0.0-alpha85-health-medication'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          mkdir -p release
          cp "$APK" release/AB_FILE_PRO_V2_ALPHA85_HEALTH_MEDICATION_ARM64_TEST_DEBUG_SIGNED.apk
          cp alpha85-source.zip release/AB_FILE_PRO_V2_ALPHA85_HEALTH_MEDICATION_SAFE_SOURCE.zip
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload Alpha85 package
        uses: actions/upload-artifact@v4
        with:
          name: AB_FILE_PRO_V2_ALPHA85_HEALTH_MEDICATION
          path: release/*
          if-no-files-found: error
          retention-days: 7
