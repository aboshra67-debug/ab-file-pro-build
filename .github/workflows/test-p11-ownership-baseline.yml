name: Confirm P11 bounds preservation defects
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scanner-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AB98_P11_SCANNER_SAFE_FIX
          run-id: 37835468449
          github-token: ${{ github.token }}
          path: release
      - name: Verify exact APK and Safe Source from first P11 patch
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          cd ..
          mkdir project runtime-evidence
          unzip -q release/AB_FILE_PRO_V2_ALPHA98_P11_SCANNER_SAFE_FIX_SOURCE.zip -d project
      - name: Install host test dependencies
        run: python3 -m pip install --break-system-packages uiautomator2 Pillow pypdf
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce bounds preservation defects on pre-review candidate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none -no-snapshot
          script: |
            adb shell getprop ro.product.cpu.abilist | tee runtime-evidence/device-abis.txt
            adb shell getprop ro.dalvik.vm.native.bridge | tee runtime-evidence/native-bridge.txt
            adb install -r release/AB98_P11_SCANNER_SAFE_FIX_TEST.apk
            adb shell wm size 480x1054
            adb shell wm density 213
            adb shell svc wifi disable
            adb shell svc data disable
            python3 -u tools/verify_p11_ownership_baseline.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_OWNERSHIP_RED_EVIDENCE
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 14

