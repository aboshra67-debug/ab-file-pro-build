name: Build AB File Pro Alpha98 Buttons P3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-alpha98-buttons-p3.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Retrieve exact P3 source with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='hiJrfAfu8aEO'
          curl -fsSL --retry 3 "$API/shares/$SHARE/files?maxResults=1000" -o listing.json
          FILE_ID=$(python3 - <<'PY'
          import json
          hits=[f for f in json.load(open("listing.json")).get("files",[]) if f.get("fileName")=="AB98_P3_Source.zip"]
          if len(hits)!=1: raise SystemExit("P3 source missing / duplicate")
          print(hits[0]["fileId"])
          PY
          )
          curl -fsSL --retry 3 -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o download.json
          URL=$(python3 -c 'import json;print(json.load(open("download.json"))["downloadUrl"])')
          curl -fsSL --retry 3 "$URL" -o p3-source.zip
          echo 'f42a435c6239b674c4734545a3d10d4d3539968976e9347281ea6b4e41cfe192  p3-source.zip' | sha256sum -c -
          mkdir project
          unzip -q p3-source.zip -d project
          grep -q '^2.0.0-alpha98-prayer-ui-reference-polish$' project/VERSION
          grep -q 'versionCode = 159' project/app/build.gradle.kts
          test -s project/app/src/main/java/com/abfilepro/app/ui/screens/assistant/AssistantButtonStyles.kt
          test -s project/app/src/main/assets/tessdata/ara.traineddata
          test -s project/app/src/main/assets/tessdata/eng.traineddata
          test -s project/app/src/main/assets/tessdata/fra.traineddata
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 project/tools/test_alpha98_navigation_safe_patch.py
          python3 project/tools/test_alpha98_calculator_currency_safe_patch.py
          python3 project/tools/test_alpha98_prayer_ui_contract.py
          python3 project/tools/test_alpha98_assistant_buttons_p3.py
          python3 -m py_compile project/family-sync-server/main.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Give preview unique application id to protect original installation
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^        debug {$/a\            applicationIdSuffix = ".alpha98buttonsP3"' project/app/build.gradle.kts
          sed -i 's/android:label="AB File Pro"/android:label="AB File Pro P3 Buttons Test"/' project/app/src/main/AndroidManifest.xml
          grep -q 'applicationIdSuffix = ".alpha98buttonsP3"' project/app/build.gradle.kts
      - name: Build APK
        working-directory: project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify signed APK and save artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.abfilepro.app.alpha98buttonsP3'"
          echo "$BADGING" | grep -q "versionCode='159'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          mkdir -p release
          cp "$APK" release/AB98_P3.apk
          cp signature.txt release/signature.txt
          echo 'Independent test APK, package com.abfilepro.app.alpha98buttonsP3. Original AB File Pro stays installed. Real-device installation must be checked on the device.' > release/NOTICE.txt
          sha256sum release/AB98_P3.apk | tee release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AB98_P3_APK
          path: release/*
          if-no-files-found: error
          retention-days: 7
